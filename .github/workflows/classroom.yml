name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: docker/setup-buildx-action@v2
        
      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: oauth
          password: ${{ secrets.YC_OAUTH_TOKEN }}
          
      - name: Setup and Deploy to Yandex Cloud
        run: |
          echo "|"
          echo "|"
          echo "=== Installing Yandex Cloud CLI ==="
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          export PATH="/home/runner/yandex-cloud/bin:$PATH"
          
          echo "|"
          echo "|"
          echo "=== Installing kubectl ==="
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          echo "|"
          echo "|"
          echo "=== Installing Helm ==="
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          echo "|"
          echo "|"
          echo "=== Configuring YC CLI ==="
          yc config set token "${{ secrets.YC_OAUTH_TOKEN }}"
          yc config set folder-id "b1g1ok9v2ph2i9k05bot"
          yc container registry configure-docker
          
          echo "|"
          echo "|"
          echo "=== Getting kubeconfig ==="
          yc managed-kubernetes cluster get-credentials rsoi-kuber --external
          
          echo "|"
          echo "|"
          echo "=== Deploying application ==="
          helm upgrade rsoi-app ./charts --install \
            --namespace test \
            -f ./charts/service-values/gateway-values.yaml \
            --set image.repository=cr.yandex/${{secrets.YC_CR_ID}} \
            --set image.tag=latest \
            --wait
          
          helm upgrade rsoi-app ./charts --install \
            --namespace test \
            -f ./charts/service-values/tickets-values.yaml \
            --set image.repository=cr.yandex/${{secrets.YC_CR_ID}} \
            --set image.tag=latest \
            --wait
          
          helm upgrade rsoi-app ./charts --install \
            --namespace test \
            -f ./charts/service-values/flight-values.yaml \
            --set image.repository=cr.yandex/${{secrets.YC_CR_ID}} \
            --set image.tag=latest \
            --wait
          
          helm upgrade rsoi-app ./charts --install \
            --namespace test \
            -f ./charts/service-values/bonus-values.yaml \
            --set image.repository=cr.yandex/${{secrets.YC_CR_ID}} \
            --set image.tag=latest \
            --wait
          
          echo "|"
          echo "|"
          echo "=== Waiting for services ==="
          kubectl wait -n test -l app.kubernetes.io/name=gateway-service pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=bonus-service pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=flight-service pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=tickets-service pod --for=condition=Ready --timeout=180s

      - name: Wait before services are ready
        run: kubectl wait -n test -l app.kubernetes.io/name=gateway-service --for=condition=Ready pod --timeout=5m

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true