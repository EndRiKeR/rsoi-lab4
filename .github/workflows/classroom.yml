name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - uses: docker/setup-buildx-action@v2
        
        
      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: oauth
          password: ${{ secrets.YC_OAUTH_TOKEN }}
          
      - name: Build and push images
        timeout-minutes: 15
        run: |
          docker build -t cr.yandex/${{ secrets.YC_CR_ID }}/gateway-service:latest ./services/GatewayService
          docker build -t cr.yandex/${{ secrets.YC_CR_ID }}/tickets-service:latest ./services/TicketsService
          docker build -t cr.yandex/${{ secrets.YC_CR_ID }}/bonuses-service:latest ./services/BonusesService
          docker build -t cr.yandex/${{ secrets.YC_CR_ID }}/flight-service:latest ./services/FlightService

          docker push cr.yandex/${{ secrets.YC_CR_ID }}/gateway-service:latest
          docker push cr.yandex/${{ secrets.YC_CR_ID }}/tickets-service:latest
          docker push cr.yandex/${{ secrets.YC_CR_ID }}/bonuses-service:latest
          docker push cr.yandex/${{ secrets.YC_CR_ID }}/flight-service:latest  
          
      - name: Setup and Deploy to Yandex Cloud
        run: |
          echo "=== Installing Yandex Cloud CLI ==="
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH
          
          echo "=== Installing kubectl ==="
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          echo "=== Installing Helm ==="
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          echo "=== Configuring YC CLI ==="
          yc config set token "${{ secrets.YC_OAUTH_TOKEN }}"
          yc config set folder-id "b1g1ok9v2ph2i9k05bot"
          yc container registry configure-docker
          
          echo "=== Getting kubeconfig ==="
          yc managed-kubernetes cluster get-credentials ваш-кластер --external
          
          echo "=== Creating namespace ==="
          kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -
          
          echo "=== Deploying PostgreSQL ==="
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm install postgresql bitnami/postgresql \
            --namespace test \
            --set auth.database=main_db \
            --set auth.username=admin \
            --set auth.password=password \
            --set primary.persistence.enabled=false
          
          echo "=== Deploying application ==="
          helm upgrade --install rsoi-app ./charts \
            --namespace test \
            --set global.imageRegistry=cr.yandex/crpu1332vtb4lbe2bv5n \
            --set bonusService.imageTag=latest \
            --set flightService.imageTag=latest \
            --set ticketService.imageTag=latest \
            --set gatewayService.imageTag=latest \
            --set ingress.enabled=true
          
          echo "=== Waiting for services ==="
          kubectl wait -n test -l app.kubernetes.io/name=gateway pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=bonus pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=flight pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=ticket pod --for=condition=Ready --timeout=180s
          
          echo "=== Final check ==="
          kubectl get pods -n test
          kubectl get services -n test
          kubectl get ingress -n test

      - name: Wait before services are ready
        run: kubectl wait -n test -l app=gateway --for=condition=Ready pod --timeout=5m

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true