name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Build images
        timeout-minutes: 10
        run: docker compose build --push

      - name: Setup and Deploy to Yandex Cloud
        run: |
          # Установка всех инструментов
          echo "=== Installing Yandex Cloud CLI ==="
          curl -s https://storage.yandex-cloud.net/yandexcloud-yc/install.sh | bash
          export PATH=$HOME/yandex-cloud/bin:$PATH
          
          echo "=== Installing kubectl ==="
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          echo "=== Installing Helm ==="
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          # Проверка установки
          echo "=== Verification ==="
          yc --version
          kubectl version --client
          helm version
          
          # Настройка YC CLI
          echo "=== Configuring YC CLI ==="
          yc config set token "${{ secrets.YC_OAUTH_TOKEN }}"
          yc config set folder-id "b1g1ok9v2ph2i9k05bot"
          yc container registry configure-docker
          
          # Получение доступа к кластеру
          echo "=== Getting kubeconfig ==="
          yc managed-kubernetes cluster get-credentials ваш-кластер --external
          
          # Создание namespace
          echo "=== Creating namespace ==="
          kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -
          
          # Установка PostgreSQL
          echo "=== Deploying PostgreSQL ==="
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm install postgresql bitnami/postgresql \
            --namespace test \
            --set auth.database=main_db \
            --set auth.username=admin \
            --set auth.password=password \
            --set primary.persistence.enabled=false
          
          # Деплой приложения
          echo "=== Deploying application ==="
          helm upgrade --install rsoi-app ./charts \
            --namespace test \
            --set global.imageRegistry=cr.yandex/crpu1332vtb4lbe2bv5n \
            --set bonusService.imageTag=latest \
            --set flightService.imageTag=latest \
            --set ticketService.imageTag=latest \
            --set gatewayService.imageTag=latest \
            --set ingress.enabled=true
          
          # Ожидание сервисов
          echo "=== Waiting for services ==="
          kubectl wait -n test -l app.kubernetes.io/name=gateway pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=bonus pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=flight pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/name=ticket pod --for=condition=Ready --timeout=180s
          
          # Проверка
          echo "=== Final check ==="
          kubectl get pods -n test
          kubectl get services -n test
          kubectl get ingress -n test

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true