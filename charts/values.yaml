global:
  imageRegistry: ""

bonusService:
  replicaCount: 2
  image: "bonus-service"
  imageTag: "latest"
  servicePort: 80
  database: "bonus_db"
  livenessProbe:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

flightService:
  replicaCount: 2
  image: "flight-service"
  imageTag: "latest"
  servicePort: 80
  database: "flight_db"
  livenessProbe:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

ticketService:
  replicaCount: 2
  image: "ticket-service"
  imageTag: "latest"
  servicePort: 80
  database: "ticket_db"
  livenessProbe:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

gatewayService:
  replicaCount: 2
  image: "gateway-service"
  imageTag: "latest"
  servicePort: 80
  livenessProbe:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /health
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

replicaCount: 2

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: gateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}